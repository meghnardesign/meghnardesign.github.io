<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Your Name — Home</title>
  <meta name="description" content="Personal website + visualization portfolio." />
  <link rel="stylesheet" href="style.css" />
  <script src="main.js" defer></script>
</head>


  <main class="page">
    <header class="hero">
      <h1 class="hero-title">Hi, I’m <span class="hero-name">Your Name</span>.</h1>

      <p class="hero-subtitle">
        4th year SIAT @ SFU student studying<br/>
        Interaction Design + Mobile/Web Development &amp; Design.
      </p>
    </header>

    <!-- Photo stack: hover/click to expand -->
    <section class="photo-area" aria-label="Photo stack">
      <div
        id="photoStack"
        class="photo-stack"
        tabindex="0"
        role="button"
        aria-label="Hover or press to expand photos"
        aria-expanded="false"
      >
        <!-- Replace these image src paths with your real photos -->
<figure class="polaroid p-left">
  <img src="images/climbing.jpg" alt="Indoor bouldering/climbing photo" loading="lazy" />
</figure>

<figure class="polaroid p-center">
  <img src="images/concerts.jpg" alt="Concert photo with a performer on stage" loading="lazy" />
</figure>

<figure class="polaroid p-right">
  <img src="images/cooking.jpg" alt="Homemade meal photo (bowls of soup)" loading="lazy" />
</figure>


        <div class="hover-frame" aria-hidden="true">
          <span>Hover to Expand!</span>
        </div>
      </div>

      <p id="expandedNote" class="expanded-note" aria-hidden="true">
        When I’m not designing, I like to<br/>
        adventure, cook, and go to concerts!
      </p>
    </section>

    <section class="cta-area" aria-label="Links">
      <a class="btn btn-primary" href="visualizations.html">
        Explore my Visualizations
        <span class="icon" aria-hidden="true">
        </span>
      </a>

      <!-- Update to your real email -->
      <a class="btn btn-outline" href="mailto:youremail@example.com">
        Want to chat? Click here to send me an email
        <span class="icon" aria-hidden="true">
        </span>
      </a>
    </section>
  </main>
</body>
</html>
