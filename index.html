<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meghna's Website!</title>
  <meta name="description" content="Personal website + visualization portfolio." />
  <link rel="stylesheet" href="style.css" />
  <script src="main.js" defer></script>
</head>

<body class="theme-pink">
  <main class="page">
    <header class="hero">
      <h1 class="hero-title">Hi, I’m <span class="hero-name">Meghna</span>.</h1>

      <p class="hero-subtitle">
        4th year SIAT @ SFU student studying<br />
        Interaction Design + Mobile/Web Development and Design.
        <br />
        When I’m not designing, I like to adventure, cook, and go to concerts!
      </p>
    </header>

    <section class="photo-area" aria-label="Photo stack">
      <div
        id="photoStack"
        class="photo-stack"
        tabindex="0"
        role="button"
        aria-label="Hover or press to expand photos"
        aria-expanded="false"
      >
        <figure class="polaroid p-left">
          <img src="images/climbing.jpg" alt="Indoor bouldering/climbing photo" loading="lazy" />
        </figure>

        <figure class="polaroid p-center">
          <img src="images/concerts.jpg" alt="Concert photo with a performer on stage" loading="lazy" />
        </figure>

        <figure class="polaroid p-right">
          <img src="images/cooking.jpg" alt="Homemade meal photo (bowls of soup)" loading="lazy" />
        </figure>

        <div class="hover-frame" aria-hidden="true">
          <span>Hover to expand</span>
        </div>
      </div>
    </section>

    <section class="cta-area" aria-label="Links">
      <a class="btn btn-primary" href="visualizations.html">
        Explore my Visualizations
        <span class="icon" aria-hidden="true">
          <svg class="icon-svg" viewBox="0 0 24 24">
            <path d="M7 17L17 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
            <path d="M9 7h8v8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
          </svg>
        </span>
      </a>

      <a class="btn btn-outline" href="mailto:mra125@sfu.ca">
        Want to connect? Click here to send me an email
      </a>
    </section>
  </main>
</body>
</html>
