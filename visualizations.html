<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meghna's Visualizations!</title>
  <meta name="description" content="SVG visualization portfolio." />
  <link rel="stylesheet" href="style.css" />
  <script src="main.js" defer></script>
  <script src="vis.js" defer></script>
</head>

<body class="theme-pink">
  <main class="page page-viz">
    <header class="viz-hero">
      <h1 class="viz-title">Visualizations</h1>

      <a class="btn btn-primary btn-back" href="index.html">
        Go back to Home
        <span class="icon" aria-hidden="true">
          <svg class="icon-svg" viewBox="0 0 24 24">
            <path d="M7 17L17 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
            <path d="M9 7h8v8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
          </svg>
        </span>
      </a>
    </header>

    <section class="viz-row" aria-labelledby="viz1-title">
      <div class="viz-label">
        <p class="viz-num">01/</p>
        <h2 id="viz1-title" class="viz-name">Brain Tabs!</h2>
      </div>
      <div id="viz1" class="viz-canvas"></div>
    </section>

    <section class="viz-row" aria-labelledby="viz2-title">
      <div class="viz-label">
        <p class="viz-num">02/</p>
        <h2 id="viz2-title" class="viz-name">Cute Cat!</h2>
        <p class="viz-note">Coming soon</p>
      </div>
      <div id="viz2" class="viz-canvas"></div>
    </section>
  </main>
</body>
</html>
